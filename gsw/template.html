/* ═══════════════════════════════════════════════════════════
   3. RENDER
   ═══════════════════════════════════════════════════════════ */
let LANG = (localStorage.getItem('gsw-lang')==='en') ? 'en' : 'pt';
const t = o => (o && typeof o==='object' && 'pt' in o) ? (o[LANG]||o.pt) : (o||'');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function imgTag(key,alt){
  if(!IMG[key]) return `<div class="missing">${esc(t(DOC.ui.missing)).replace(/\n/g,'<br>')}</div>`;
  return `<img src="${IMG[key]}" alt="${esc(alt)}" loading="lazy">`;
}

/* Apelido que aparece no print  ->  nickname real da pessoa.
   A transcrição sempre mostra o nickname real; o apelido do print
   vai embaixo, em cinza, pra bater com a imagem ao lado. */
const CANON = {
  'Fatal_Addicted':'B_Attomic', 'Warrer':'B_Attomic', 'AsymptomaticSlowness':'B_Attomic',
  'Bigo':'Bigouslino', 'Bigos':'Bigouslino',
  'Volkzz':'Volkzz101',
  'iYasuo_':'iMonoYasuo',
  'Kwte':'SoggyKwte',
  'Closerapha':'CloseRapha',
  'infinity1111':'1nfinity',
  'rafaelgomes':'RafaelGomes'
};
function whoTag(l){
  const raw = l.who || '';
  const real = CANON[raw] || raw;
  const sub = l.raw || (real !== raw ? raw : '');
  return `<span class="who">${esc(real)}${sub?`<em>${esc(sub)}</em>`:''}</span>`;
}
function renderLines(lines){
  return lines.map(l=>{
    const cls = l.cls ? l.cls : ('s-'+l.side);
    return `<div class="line ${cls}">${whoTag(l)}<span class="txt">${esc(t(l))}</span></div>`;
  }).join('');
}
function renderOrig(lines){
  return lines.map(l=>`<div class="line ${l.cls?l.cls:('s-'+l.side)}">${whoTag(l)}<span class="txt">${esc(l.pt)}</span></div>`).join('');
}

function renderEvidence(evi,actNum,idx){
  const n = evi.slides.length;
  /* saída de bot (log de ban) não tem transcrição: a imagem já é o
     texto. Nesses casos o print ocupa a largura inteira. */
  const slides = evi.slides.map((s,i)=>{
    const has = s.lines && s.lines.length;
    return `
    <div class="slide ${i===0?'on':''}" data-i="${i}">
      <div class="slide-grid${has?'':' nolines'}">
        <div class="shot">
          ${imgTag(s.img, t(evi.label)+' — '+(i+1))}
          <div class="cap">${t(s.cap)}</div>
        </div>
        ${has?`<div class="script">
          <div class="sh">${esc(t(DOC.ui.transcript))} · ${i+1}/${n}</div>
          <div class="lines">${renderLines(s.lines)}</div>
          ${LANG==='en'?`<button class="origtoggle" type="button">${esc(t(DOC.ui.showOrig))}</button>
          <div class="orig">${renderOrig(s.lines)}</div>`:''}
        </div>`:''}
      </div>
    </div>`;
  }).join('');
  const dots = n>1 ? evi.slides.map((_,i)=>`<i data-i="${i}" class="${i===0?'on':''}"></i>`).join('') : '';
  const nav = n>1 ? `
    <div class="evi-nav">
      <button class="prev" disabled>${esc(t(DOC.ui.prev))}</button>
      <div class="dots">${dots}</div>
      <button class="next">${esc(t(DOC.ui.next))}</button>
    </div>` : '';
  return `
  <div class="evi" data-idx="0" data-n="${n}">
    <div class="evi-head">
      <span class="badge">${esc(t(DOC.ui.evidence))} ${actNum}.${idx+1}</span>
      <span class="lbl">${t(evi.label)}</span>
      <span class="count">${n} ${n>1?'prints':'print'}</span>
    </div>
    ${slides}
    ${nav}
  </div>`;
}

function render(){
  document.documentElement.lang = LANG==='en'?'en':'pt-BR';
  const D = DOC;

  /* nav */
  const navItems = [
    ['hero', t(D.ui.navHero)],
    ...D.acts.map(a=>[a.id, a.num]),
    ['owned', t(D.ui.navOwned)],
    ['ask', t(D.ui.navAsk)]
  ];
  document.getElementById('nav').innerHTML = navItems
    .map(([id,l])=>`<a href="#${id}" data-t="${id}">${esc(l)}</a>`).join('');

  /* hero */
  let h = `
  <section id="hero"><div class="wrap">
    <div class="eyebrow rv">${esc(t(D.hero.eyebrow))}</div>
    <h1 class="rv">${t(D.hero.title)}</h1>
    <p class="sub rv">${t(D.hero.sub)}</p>
  </div><div class="scrollcue">${esc(t(D.hero.cue))}</div></section>`;

  /* como ler */
  h += `
  <section id="howto"><div class="wrap">
    <div class="blocktitle rv">${esc(t(D.howto.kicker))}</div>
    <h2 class="big rv">${esc(t(D.howto.title))}</h2>
    <div class="principles rv">
      ${D.howto.items.map(i=>`<article><span class="n">${i.n}</span><h3>${esc(t(i.h))}</h3><p>${esc(t(i.p))}</p></article>`).join('')}
    </div>
  </div></section>`;

  /* elenco */
  h += `
  <section id="cast"><div class="wrap">
    <div class="blocktitle rv">${esc(t(D.cast.kicker))}</div>
    <h2 class="big rv">${esc(t(D.cast.title))}</h2>
    <p class="castnote rv">${t(D.cast.note)}</p>
    ${D.cast.groups.map(g=>`
      <div class="castgroup rv">
        <h3 class="g-${g.side}">${esc(t(g.label))}</h3>
        <div class="people${g.people.length===1?' solo':''}">
          ${g.people.map(p=>`
            <div class="person is-${g.side}">
              <div class="nick">${esc(p.nick)}</div>
              <div class="alias">${p.alias==='—'?'—':'<span>=</span> '+esc(p.alias)}</div>
              <div class="role">${t(p.role)}</div>
            </div>`).join('')}
        </div>
      </div>`).join('')}
    <div class="guildkey rv">${D.cast.guilds.map(([a,b])=>`<span><b>${esc(a)}</b>${b==='—'?'':' · '+esc(b)}</span>`).join('')}</div>
  </div></section>`;

  /* atos */
  h += `<div id="acts">` + D.acts.map(a=>`
    <section class="act" id="${a.id}"><div class="wrap"><div class="act-inner">
      <div class="rail rv">
        <span class="num">${a.num}</span>
        <span class="yr">${esc(a.yr)}</span>
        <span class="tag">${esc(t(a.tag))}</span>
      </div>
      <div class="act-main">
        <div class="rv">
          <div class="blocktitle">${esc(t(D.ui.actWord))} ${a.num} · ${esc(t(a.date))}</div>
          <h2>${esc(t(a.title))}</h2>
          <p class="lede">${t(a.lede)}</p>
        </div>
        <div class="body rv">${a.body.map(p=>`<p>${t(p)}</p>`).join('')}</div>
        ${a.evidence.length===0?`<div class="noproof rv">${esc(t(D.ui.noproof))}</div>`:''}
        ${a.evidence.map((e,i)=>`<div class="rv">${renderEvidence(e,a.num,i)}</div>`).join('')}
      </div>
    </div></div></section>`).join('') + `</div>`;

  /* onde eu errei */
  h += `
  <section id="owned"><div class="wrap">
    <div class="shellbox rv">
      <div class="blocktitle">${esc(t(D.owned.kicker))}</div>
      <h2>${esc(t(D.owned.title))}</h2>
      <p class="intro">${esc(t(D.owned.intro))}</p>
      <ol class="owns">${D.owned.items.map(i=>`<li>${t(i)}</li>`).join('')}</ol>
    </div>
  </div></section>`;

  /* pedido */
  h += `
  <section id="ask"><div class="wrap">
    <div class="blocktitle rv">${esc(t(D.ask.kicker))}</div>
    <h2 class="big rv">${esc(t(D.ask.title))}</h2>
    <div class="asks rv">${D.ask.items.map(i=>`<article><h3>${esc(t(i.h))}</h3><p>${esc(t(i.p))}</p></article>`).join('')}</div>
    <div class="sig rv">${esc(t(D.ask.sig))}</div>
  </div></section>`;

  document.getElementById('app').innerHTML = h;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===LANG));
  wire();
}

/* ═══════════════════════════════════════════════════════════
   4. INTERAÇÃO
   ═══════════════════════════════════════════════════════════ */
function goSlide(evi,i){
  const n = +evi.dataset.n;
  i = Math.max(0, Math.min(n-1, i));
  evi.dataset.idx = i;
  evi.querySelectorAll(':scope > .slide').forEach(s=>s.classList.toggle('on', +s.dataset.i===i));
  evi.querySelectorAll('.dots i').forEach(d=>d.classList.toggle('on', +d.dataset.i===i));
  const p = evi.querySelector('.prev'), nx = evi.querySelector('.next');
  if(p) p.disabled = i===0;
  if(nx) nx.disabled = i===n-1;
}

function wire(){
  /* carrossel */
  document.querySelectorAll('.evi').forEach(evi=>{
    const p = evi.querySelector('.prev'), n = evi.querySelector('.next');
    if(p) p.onclick = ()=>goSlide(evi, +evi.dataset.idx - 1);
    if(n) n.onclick = ()=>goSlide(evi, +evi.dataset.idx + 1);
    evi.querySelectorAll('.dots i').forEach(d=>d.onclick = ()=>goSlide(evi, +d.dataset.i));
    evi.tabIndex = 0;
    evi.onkeydown = e=>{
      if(e.key==='ArrowRight'){goSlide(evi, +evi.dataset.idx+1); e.preventDefault();}
      if(e.key==='ArrowLeft'){goSlide(evi, +evi.dataset.idx-1); e.preventDefault();}
    };
  });

  /* original PT sob a tradução */
  document.querySelectorAll('.origtoggle').forEach(b=>{
    b.onclick = ()=>{
      const box = b.nextElementSibling;
      const on = box.classList.toggle('on');
      b.textContent = on ? t(DOC.ui.hideOrig) : t(DOC.ui.showOrig);
    };
  });

  /* lightbox */
  const lb = document.getElementById('lb'), lbi = lb.querySelector('img');
  document.querySelectorAll('.shot img').forEach(im=>{
    im.onclick = ()=>{ lbi.src = im.src; lbi.alt = im.alt; lb.classList.add('on'); };
  });
  lb.onclick = ()=>lb.classList.remove('on');

  /* reveal — com rede de segurança: se por qualquer motivo o
     observer não disparar, tudo aparece em 2,5s de qualquer jeito */
  const all = [...document.querySelectorAll('.rv')];
  if(document.documentElement.classList.contains('anim')){
    const io = new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
    },{rootMargin:'0px 0px -8% 0px',threshold:.06});
    all.forEach((el,i)=>{
      el.style.transitionDelay = Math.min(i%6,5)*55 + 'ms';
      io.observe(el);
    });
    /* o que já está na tela aparece na hora, sem esperar o observer */
    const vh = window.innerHeight || 800;
    all.forEach(el=>{
      const r = el.getBoundingClientRect();
      if(r.top < vh && r.bottom > 0) el.classList.add('in');
    });
    clearTimeout(window.__rvSafety);
    window.__rvSafety = setTimeout(()=>all.forEach(el=>el.classList.add('in')), 2500);
  } else {
    all.forEach(el=>el.classList.add('in'));
  }

  /* scrollspy */
  const links = [...document.querySelectorAll('#nav a')];
  const targets = links.map(a=>document.getElementById(a.dataset.t)).filter(Boolean);
  if('IntersectionObserver' in window && targets.length){
    const spy = new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(e.isIntersecting){
          links.forEach(a=>a.classList.toggle('on', a.dataset.t===e.target.id));
        }
      });
    },{rootMargin:'-45% 0px -50% 0px'});
    targets.forEach(s=>spy.observe(s));
  }
}

/* só liga a animação de entrada se o navegador der suporte */
if('IntersectionObserver' in window) document.documentElement.classList.add('anim');

document.addEventListener('keydown', e=>{
  if(e.key==='Escape') document.getElementById('lb').classList.remove('on');
});
document.querySelectorAll('#lang button').forEach(b=>{
  b.onclick = ()=>{
    if(LANG===b.dataset.l) return;
    LANG = b.dataset.l;
    localStorage.setItem('gsw-lang', LANG);
    const y = window.scrollY;
    render();
    window.scrollTo(0,y);
  };
});

render();
</script>
